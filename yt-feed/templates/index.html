<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<script>
  (function () {
    var t = localStorage.getItem("theme");
    if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root { --bg:#F6F7FB; --surface:#FFFFFF; --surface2:#EEF1F8; --ink:#0E1424; --muted:#5B6479; --line:#E1E5EF; --skel:#E6E9F2;
          --red:#E5484D; --a:#5B5BF0; --b:#22B8E8; --grad:linear-gradient(120deg,var(--a),var(--b));
          --sh:0 1px 2px rgba(14,20,36,.05),0 12px 32px rgba(14,20,36,.08); }
  [data-theme="dark"] { --bg:#0A0F1C; --surface:#121A2E; --surface2:#18223B; --ink:#E8ECF7; --muted:#8E99B3; --line:#222D48;
          --skel:#1B2540; --red:#FF6B75; --sh:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.4); }
  * { box-sizing:border-box; }
  body { margin:0; padding:0 32px 56px; background:var(--bg); color:var(--ink); line-height:1.45;
         font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; }
  button { font:inherit; color:inherit; cursor:pointer; }
  :focus-visible { outline:2px solid var(--a); outline-offset:2px; }
  mark { background:color-mix(in srgb,var(--a) 30%,transparent); color:inherit; border-radius:3px; padding:0 2px; }

  /* header */
  #top { position:sticky; top:0; z-index:10; margin:0 -32px; padding:12px 32px 0; border-bottom:1px solid var(--line);
         background:color-mix(in srgb,var(--bg) 86%,transparent); backdrop-filter:blur(14px); }
  header { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px; padding-bottom:10px; }
  #nav { position:relative; display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; }
  .navbtn { position:relative; z-index:1; display:inline-block; background:none; border:none; padding:9px 13px; border-radius:8px;
            font-size:14.5px; font-weight:600; color:var(--muted); white-space:nowrap; text-decoration:none; transition:color .2s,background .2s; }
  .navbtn:hover { color:var(--ink); background:var(--surface2); }
  .navbtn.active { color:var(--ink); }
  #navPill { position:absolute; left:0; bottom:0; height:2.5px; width:0; border-radius:2px; background:var(--grad); pointer-events:none;
             transition:transform .35s cubic-bezier(.3,.9,.3,1),width .35s cubic-bezier(.3,.9,.3,1),opacity .2s; }
  #subjectWrap { position:relative; }
  #subjectBtn { display:flex; align-items:center; gap:10px; background:none; border:none; padding:4px 12px; border-radius:12px;
                font-size:25px; font-weight:800; letter-spacing:-.02em; white-space:nowrap; }
  #subjectBtn::before { content:""; width:11px; height:11px; border-radius:50%; background:var(--grad); }
  #subjectBtn:hover, #subjectBtn[aria-expanded="true"] { background:var(--surface); }
  #subjectBtn svg { width:18px; height:18px; stroke:var(--muted); fill:none; stroke-width:2.5; transition:transform .15s; }
  #subjectBtn[aria-expanded="true"] svg { transform:rotate(180deg); }
  #subjectMenu { display:none; position:absolute; left:50%; top:calc(100% + 8px); transform:translateX(-50%); width:310px; padding:6px;
                 background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--sh); z-index:70; }
  #subjectMenu.open { display:block; }
  .sopt { display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; border:none; background:none;
          text-align:left; padding:10px 12px; border-radius:9px; font-size:14.5px; font-weight:500; }
  .sopt:hover { background:var(--surface2); }
  .sopt.sel, .sopt.sel:hover { background:color-mix(in srgb,var(--a) 14%,transparent); font-weight:700; }
  .soon { font-size:11.5px; font-weight:600; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:1px 8px; }
  #tools { display:flex; justify-content:flex-end; align-items:center; gap:8px; }
  #searchBox { position:relative; flex:1; max-width:380px; }
  .searchIcon { position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; stroke:var(--muted); fill:none; stroke-width:2; pointer-events:none; }
  #search { width:100%; padding:10px 14px 10px 38px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-size:14px; }
  #search:focus { outline:none; border-color:var(--a); box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 20%,transparent); }
  #themeBtn { width:40px; height:40px; flex:none; border-radius:10px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; }
  #themeBtn svg { width:18px; height:18px; stroke:var(--ink); fill:none; stroke-width:2; }
  #sugg { display:none; position:absolute; left:0; right:0; top:calc(100% + 6px); background:var(--surface); border:1px solid var(--line);
          border-radius:12px; overflow:hidden; z-index:70; box-shadow:var(--sh); }
  .sugg-item { display:flex; align-items:center; gap:10px; padding:10px 14px; font-size:14px; cursor:pointer; }
  .sugg-item:hover { background:var(--surface2); }
  .sugg-item svg { width:15px; height:15px; flex:none; stroke:var(--muted); fill:none; stroke-width:2; }
  .sugg-item .label { flex:1; }
  .sugg-item .x { color:var(--muted); padding:0 4px; }
  #shelf { display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; margin-bottom:-1px; }
  .stab { flex:none; background:none; border:none; border-bottom:2.5px solid transparent; padding:9px 14px; font-size:14px; font-weight:600; color:var(--muted); }
  .stab:hover { color:var(--ink); }
  .stab.on { color:var(--ink); border-bottom-color:var(--a); }

  /* pills */
  .pill { background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:7px 14px; font-size:13.5px; font-weight:600; white-space:nowrap; transition:border-color .15s; }
  .pill:hover { border-color:var(--a); }
  .pill.active { background:var(--a); border-color:var(--a); color:#fff; }
  #tabs { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin-bottom:20px; padding:2px 0; }
  #subrow { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  #subrow:empty { display:none; }

  /* hero */
  #hero { position:relative; isolation:isolate; overflow:hidden; margin:26px 0 8px; padding:40px 44px 36px; background:var(--surface);
          border:1px solid var(--line); border-radius:20px; box-shadow:var(--sh); }
  #hero::before { content:""; position:absolute; inset:0; z-index:-1;
                  background:radial-gradient(60% 130% at 100% 0%,color-mix(in srgb,var(--a) 24%,transparent),transparent 70%),
                             radial-gradient(40% 90% at 85% 100%,color-mix(in srgb,var(--b) 16%,transparent),transparent 70%); }
  #hero::after { content:""; position:absolute; inset:0; z-index:-1; opacity:.55;
                 background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
                 background-size:38px 38px; -webkit-mask-image:radial-gradient(60% 110% at 100% 0%,#000,transparent 72%);
                 mask-image:radial-gradient(60% 110% at 100% 0%,#000,transparent 72%); }
  #eyebrow { font-size:12.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--a); margin-bottom:12px; }
  #hero h1 { margin:0; font-size:40px; line-height:1.12; font-weight:800; letter-spacing:-.025em; }
  #hello span { color:var(--a); }
  #hero p { margin:8px 0 26px; font-size:19px; font-weight:500; color:var(--muted); max-width:52ch; }
  #heroSearch { display:flex; align-items:center; gap:10px; width:min(680px,100%); padding:6px 6px 6px 18px; background:var(--bg);
                border:1px solid var(--line); border-radius:14px; transition:border-color .15s,box-shadow .15s; }
  #heroSearch:focus-within { border-color:var(--a); box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 18%,transparent); }
  #heroSearch .hs { width:18px; height:18px; flex:none; stroke:var(--muted); fill:none; stroke-width:2; }
  #heroInput { flex:1; min-width:0; border:none; outline:none; background:none; color:var(--ink); font:inherit; font-size:16px; padding:11px 0; }
  #heroGo { flex:none; width:42px; height:42px; border:none; border-radius:10px; background:var(--grad); color:#fff; font-size:19px; display:grid; place-items:center; transition:transform .15s; }
  #heroGo:hover { transform:translateX(2px); }
  #heroChips { display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
  #heroChips:empty { display:none; }
  .hchip { border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:7px 14px; font-size:13.5px; font-weight:600; transition:border-color .15s,color .15s; }
  .hchip:hover { border-color:var(--a); color:var(--a); }
  #nameBtn { position:absolute; top:16px; right:20px; border:none; background:none; color:var(--muted); font-size:12.5px; font-weight:600; }
  #nameBtn:hover { color:var(--ink); }

  /* trending */
  #trending { margin:30px 0 6px; }
  .secHead { display:flex; align-items:baseline; gap:12px; margin-bottom:14px; }
  .secHead h2 { margin:0; font-size:20px; font-weight:800; letter-spacing:-.01em; }
  .secHead span { color:var(--muted); font-size:13px; font-weight:500; }
  #trendRow { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(240px,19%); gap:18px; overflow-x:auto; padding-bottom:10px; scroll-snap-type:x proximity; scrollbar-width:thin; }
  .tr { display:block; min-width:0; scroll-snap-align:start; text-decoration:none; color:inherit; }
  .tr:hover .title { text-decoration:underline; text-underline-offset:3px; }
  .rank { position:absolute; left:12px; bottom:6px; font-size:44px; font-weight:800; line-height:1; color:#fff; letter-spacing:-.04em; text-shadow:0 2px 12px rgba(0,0,0,.6); }
  .tr .title { margin-top:10px; }
  .tr .channel { margin-top:4px; }
  .vel { margin-top:3px; font-size:12.5px; font-weight:700; color:var(--a); }

  /* heading row */
  #filterBar { display:flex; flex-wrap:wrap; gap:8px; padding-top:14px; }
  #filterBar:empty { display:none; }
  .filterChip { display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--a); border-radius:999px; padding:4px 6px 4px 14px; font-size:13.5px; font-weight:600; }
  .filterChip button { width:22px; height:22px; border:none; border-radius:50%; background:var(--a); color:#fff; font-size:11px; display:grid; place-items:center; }
  #headRow { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:26px 0 14px; }
  #heading { min-width:0; margin:0; font-size:22px; font-weight:800; letter-spacing:-.015em; }
  #headBtns { display:flex; gap:8px; flex:none; }
  #topicBtn, #shuffleBtn { display:flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:8px 14px; font-size:13.5px; font-weight:600; white-space:nowrap; }
  #topicBtn:hover, #shuffleBtn:hover { border-color:var(--a); }
  #topicBtn svg { width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2; }

  /* cards */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:32px 22px; }
  .card { min-width:0; }
  .thumbWrap, .thumb { position:relative; }
  .thumb { display:block; aspect-ratio:16/9; border-radius:12px; overflow:hidden; background:var(--skel); }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .25s ease-out; }
  .card:hover .thumb img, .tr:hover .thumb img { transform:scale(1.04); }
  .badge { position:absolute; right:8px; bottom:8px; background:rgba(10,14,28,.88); color:#fff; font-size:12px; font-weight:700; padding:2px 7px; border-radius:6px; }
  .chips { position:absolute; top:8px; right:8px; display:flex; gap:6px; opacity:0; transition:opacity .15s; }
  .card:hover .chips, .chips:focus-within, .chips:has(.on) { opacity:1; }
  @media (hover:none) { .chips { opacity:1; } }
  .chip { width:34px; height:34px; border:none; border-radius:50%; background:rgba(10,14,28,.74); color:#fff; display:grid; place-items:center; }
  .chip:hover { background:rgba(10,14,28,.95); }
  .chip svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .chip.like.on { background:var(--red); }
  .chip.like.on svg { fill:currentColor; }
  .chip.later.on { background:var(--a); }
  .info { display:flex; gap:11px; padding-top:12px; }
  .avatar { flex:none; width:36px; height:36px; border-radius:50%; display:grid; place-items:center; color:#fff; font-size:15px; font-weight:700; }
  .txt { min-width:0; }
  .title { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; color:var(--ink); text-decoration:none; font-weight:700; font-size:15px; line-height:1.3; }
  .title:hover { text-decoration:underline; text-underline-offset:3px; }
  .channel { margin-top:4px; font-size:13.5px; font-weight:500; color:var(--muted); }
  .stats { margin-top:1px; font-size:13px; color:var(--muted); display:flex; gap:10px; }
  .skel .box { aspect-ratio:16/9; border-radius:12px; background:var(--skel); }
  .skel .line { height:12px; border-radius:6px; background:var(--skel); margin-top:12px; }
  .skel .line.short { width:60%; }
  .skel .box, .skel .line { animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.55; } }
  #status { text-align:center; color:var(--muted); padding:36px 12px; font-size:15px; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:10px;
           font-size:14px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s,transform .2s; z-index:80; }
  #toast.show { opacity:1; transform:translate(-50%,0); }

  /* topic atlas */
  #overlay { display:none; position:fixed; inset:0; background:rgba(6,10,24,.55); backdrop-filter:blur(5px); z-index:50; }
  #overlay.open { display:block; }
  #drawer { display:none; position:fixed; top:50%; left:50%; width:min(960px,94vw); max-height:88vh; overflow-y:auto; z-index:60; padding:28px;
            background:var(--surface); border:1px solid var(--line); border-radius:20px; transform:translate(-50%,-50%); box-shadow:0 30px 80px rgba(6,10,24,.5); }
  #drawer.open { display:block; animation:pop .28s cubic-bezier(.2,.9,.3,1.1); }
  @keyframes pop { from { opacity:0; transform:translate(-50%,-47%) scale(.97); } }
  #drawer #panel2 { margin-top:26px; padding-top:20px; border-top:1px solid var(--line); }
  #panel2 h4 { margin:0 0 12px; font-size:17px; font-weight:800; }
  .subpills { display:flex; flex-wrap:wrap; gap:8px; }
  .atlasHead { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:20px; }
  .atlasHead h3 { margin:0; font-size:26px; font-weight:800; letter-spacing:-.02em; }
  .atlasHead p { margin:4px 0 0; color:var(--muted); font-size:14.5px; }
  .atlasHead button { flex:none; border:1px solid var(--line); background:var(--surface); width:36px; height:36px; border-radius:10px; font-size:14px; }
  .tcards { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
  .tcard { display:flex; flex-direction:column; justify-content:space-between; align-items:flex-start; gap:20px; min-height:110px; padding:16px; text-align:left;
           background:var(--bg); border:1px solid var(--line); border-radius:14px; animation:rise .35s both; animation-delay:calc(var(--i) * 30ms);
           transition:transform .15s,border-color .15s,box-shadow .15s; }
  .tcard:hover { transform:translateY(-3px); border-color:var(--a); box-shadow:var(--sh); }
  .tcard.sel { border-color:var(--a); box-shadow:0 0 0 1px var(--a); }
  .tcard .n { font-size:30px; font-weight:800; line-height:1; color:var(--a); }
  .tcard .t { font-size:14.5px; font-weight:700; line-height:1.25; }
  @keyframes rise { from { opacity:0; transform:translateY(12px); } }

  @media (max-width:1100px) {
    header { display:flex; flex-wrap:wrap; gap:10px; }
    #subjectWrap { order:1; flex-basis:100%; }
    #subjectBtn { padding-left:0; }
    #subjectMenu { left:0; transform:none; width:min(310px,100%); }
    #tools { order:2; flex-basis:100%; justify-content:flex-start; }
    #searchBox { max-width:none; }
    #nav { order:3; flex-basis:100%; }
  }
  @media (max-width:860px) {
    body { padding:0 16px 40px; }
    #top { margin:0 -16px; padding:12px 16px 0; }
    #hero { padding:30px 22px 26px; border-radius:16px; }
    #hero h1 { font-size:30px; }
    #hero p { font-size:16px; }
    #trendRow { grid-auto-columns:78%; }
    #drawer { padding:20px 16px; }
  }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
  <div id="top">
    <header>
      <nav id="nav" aria-label="Your library"></nav>
      <div id="subjectWrap">
        <button id="subjectBtn" aria-haspopup="true" aria-expanded="false" aria-label="Choose subject"><span id="subjectName">Machine Learning</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <div id="subjectMenu" role="menu"></div>
      </div>
      <div id="tools">
        <div id="searchBox">
          <svg class="searchIcon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="search" type="search" autocomplete="off" placeholder="Search videos  (press /)" aria-label="Search videos">
          <div id="sugg"></div>
        </div>
        <button id="themeBtn" title="Switch light or dark theme" aria-label="Switch light or dark theme">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
        </button>
      </div>
    </header>
    <div id="shelf" aria-label="Topics"></div>
  </div>

  <main>
    <section id="hero">
      <button id="nameBtn"></button>
      <div id="eyebrow"></div>
      <h1 id="hello"></h1>
      <p id="sub"></p>
      <div id="heroSearch">
        <svg class="hs" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="heroInput" type="search" autocomplete="off" aria-label="Search videos">
        <button id="heroGo" aria-label="Search">→</button>
      </div>
      <div id="heroChips"></div>
    </section>
    <section id="trending">
      <div class="secHead"><h2>Trending now</h2><span id="trendSub"></span></div>
      <div id="trendRow"></div>
    </section>
    <div id="subrow" aria-label="Subtopics"></div>
    <div id="filterBar"></div>
    <div id="headRow">
      <h2 id="heading"></h2>
      <div id="headBtns">
        <button id="topicBtn" aria-haspopup="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>Browse topics</button>
        <button id="shuffleBtn">Shuffle</button>
      </div>
    </div>
    <div id="tabs"></div>
    <div class="grid" id="grid"></div>
    <div id="status" aria-live="polite"></div>
  </main>

  <div id="toast" role="status"></div>
  <div id="overlay"></div>
  <div id="drawer"><div class="panel" id="panel1"></div><div class="panel" id="panel2"></div></div>

  <script>
    const TABS = [
      ["shorts", "Shorts"], ["videos", "Videos"], ["u5", "Under 5 min"],
      ["5-10", "5-10 min"], ["10-30", "10-30 min"], ["30-60", "30-60 min"], ["60plus", "1 hr+"],
    ];
    const NAV = [["home", "Home"], ["history", "History"], ["liked", "Liked"], ["later", "Watch later"], ["papers", "Papers"]];
    const HEADINGS = { history: "Watch history", liked: "Liked videos", later: "Watch later" };
    const EMPTY = {
      history: "Nothing watched yet. Open a video and it will show up here.",
      liked: "No liked videos yet. Tap the heart on any video to keep it here.",
      later: "Nothing saved yet. Tap the clock on a video to queue it for later.",
    };
    const ICON = {
      heart: '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>',
      clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    };
    const LISTS = {
      liked: { cls: "like", icon: ICON.heart, on: "Remove like", off: "Like",
               toastOn: "Added to liked videos", toastOff: "Removed from liked videos" },
      later: { cls: "later", icon: ICON.clock, on: "Remove from watch later", off: "Save to watch later",
               toastOn: "Saved to watch later", toastOff: "Removed from watch later" },
    };
    const PER_PAGE = 24;

    let uid = localStorage.getItem("uid");
    if (!uid) {
      uid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Math.random()).slice(2);
      localStorage.setItem("uid", uid);
    }
    let view = "home", tab = "videos", topic = "", sub = "", q = "";
    let page = 1, seed = 0, loading = false, done = false, gen = 0;
    let tree = [], openTopic = null, toastTimer = null;

    const $ = id => document.getElementById(id);
    const grid = $("grid"), statusEl = $("status"), tabsBar = $("tabs"), navBar = $("nav");
    const filterBar = $("filterBar"), headingEl = $("heading"), shuffleBtn = $("shuffleBtn");
    const searchInput = $("search"), searchBox = $("searchBox"), suggBox = $("sugg");
    const overlay = $("overlay"), drawer = $("drawer"), panel1 = $("panel1"), panel2 = $("panel2");
    const toastEl = $("toast");

    function div(cls) { const d = document.createElement("div"); d.className = cls; return d; }

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2000);
    }

    function fmtViews(n) {
      if (n >= 1e9) return (n / 1e9).toFixed(1) + "B views";
      if (n >= 1e6) return (n / 1e6).toFixed(1) + "M views";
      if (n >= 1e3) return (n / 1e3).toFixed(1) + "K views";
      return n + " views";
    }
    function fmtDuration(s) {
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
      const pad = x => String(x).padStart(2, "0");
      return h > 0 ? h + ":" + pad(m) + ":" + pad(sec) : m + ":" + pad(sec);
    }
    function ago(iso) {
      const days = Math.floor((Date.now() - new Date(iso)) / 86400000);
      if (days < 1) return "today";
      if (days < 30) return days + (days === 1 ? " day ago" : " days ago");
      if (days < 365) { const m = Math.max(1, Math.floor(days / 30)); return m + (m === 1 ? " month ago" : " months ago"); }
      const y = Math.floor(days / 365);
      return y + (y === 1 ? " year ago" : " years ago");
    }

    function track(videoId) {
      fetch("/api/history", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ uid, video_id: videoId }), keepalive: true,
      });
    }

    // put search words in a yellow marker inside a title (safe: no innerHTML)
    function highlight(el, text) {
      const words = q.toLowerCase().split(/\s+/).filter(w => w.length > 1);
      if (view !== "home" || !words.length) { el.textContent = text; return; }
      const rx = new RegExp("(" + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "ig");
      text.split(rx).forEach((part, i) => {
        if (i % 2 === 1) { const m = document.createElement("mark"); m.textContent = part; el.appendChild(m); }
        else el.appendChild(document.createTextNode(part));
      });
    }

    function endMessage() {
      if (grid.children.length) return "You’ve reached the end";
      if (view !== "home") return EMPTY[view];
      return q ? "No videos match “" + q + "”. Try fewer words or a different spelling."
               : "No videos in this section yet.";
    }

    function listBtn(v, list, card) {
      const cfg = LISTS[list];
      const b = document.createElement("button");
      b.className = "chip " + cfg.cls;
      b.innerHTML = cfg.icon;
      const paint = () => {
        const label = v[list] ? cfg.on : cfg.off;
        b.classList.toggle("on", !!v[list]);
        b.title = label;
        b.setAttribute("aria-label", label);
      };
      paint();
      b.onclick = async () => {
        const res = await fetch("/api/toggle", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ uid, video_id: v.video_id, list }),
        });
        const data = await res.json();
        v[list] = data.on;
        paint();
        toast(data.on ? cfg.toastOn : cfg.toastOff);
        if (!data.on && view === list) {
          card.remove();
          if (!grid.children.length && done) statusEl.textContent = endMessage();
        }
      };
      return b;
    }

    function makeCard(v) {
      const isShort = v.duration <= 60;
      const url = (isShort ? "https://www.youtube.com/shorts/" : "https://www.youtube.com/watch?v=") + v.video_id;
      const card = div("card");

      const wrap = div("thumbWrap");
      const a = document.createElement("a");
      a.className = "thumb"; a.href = url; a.target = "_blank"; a.rel = "noopener";
      a.setAttribute("aria-label", v.title);
      a.onclick = () => track(v.video_id);
      const img = document.createElement("img");
      img.src = v.thumbnail; img.alt = ""; img.loading = "lazy";
      const badge = div("badge");
      badge.textContent = isShort ? "Short" : fmtDuration(v.duration);
      a.append(img, badge);
      const chips = div("chips");
      chips.append(listBtn(v, "liked", card), listBtn(v, "later", card));
      wrap.append(a, chips);

      const info = div("info");
      const title = document.createElement("a");
      title.className = "title"; title.href = url; title.target = "_blank"; title.rel = "noopener";
      title.onclick = () => track(v.video_id);
      highlight(title, v.title);
      const channel = div("channel");
      channel.textContent = v.channel;
      const stats = div("stats");
      const views = document.createElement("span"); views.textContent = fmtViews(v.views);
      const when = document.createElement("span"); when.textContent = ago(v.published_at);
      stats.append(views, when);
      const avatar = div("avatar");
      const name = (v.channel || "?").trim();
      let hue = 0; for (const ch of name) hue = (hue * 31 + ch.charCodeAt(0)) % 360;
      avatar.textContent = name.charAt(0).toUpperCase();
      avatar.style.background = "hsl(" + hue + ", 30%, 40%)";
      const txt = div("txt");
      txt.append(title, channel, stats);
      info.append(avatar, txt);

      card.append(wrap, info);
      return card;
    }

    function showSkeleton() {
      for (let i = 0; i < 8; i++) {
        const s = div("card skel");
        s.innerHTML = '<div class="box"></div><div class="line"></div><div class="line short"></div>';
        grid.appendChild(s);
      }
    }

    async function loadMore() {
      if (loading || done) return;
      loading = true;
      const myGen = gen;
      if (page === 1) showSkeleton(); else statusEl.textContent = "Loading more…";
      const params = new URLSearchParams({ view, tab, topic, sub, q, page, seed, uid, subject: subj });
      let videos;
      try {
        const res = await fetch("/api/videos?" + params);
        videos = await res.json();
      } catch (e) {
        if (myGen === gen) {
          loading = false;
          grid.querySelectorAll(".skel").forEach(s => s.remove());
          statusEl.textContent = "Couldn’t load videos. Is the server still running? ";
          const retry = document.createElement("button");
          retry.className = "pill"; retry.textContent = "Try again";
          retry.onclick = () => { statusEl.textContent = ""; loadMore(); };
          statusEl.appendChild(retry);
        }
        return;
      }
      if (myGen !== gen) return;
      grid.querySelectorAll(".skel").forEach(s => s.remove());
      videos.forEach(v => grid.appendChild(makeCard(v)));
      page++;
      statusEl.textContent = "";
      if (videos.length < PER_PAGE) {
        done = true;
        statusEl.textContent = endMessage();
      }
      loading = false;
      if (!done && statusEl.getBoundingClientRect().top < window.innerHeight + 600) loadMore();
    }

    function filterChip(text, onclick) {
      const c = div("filterChip");
      const t = document.createElement("span"); t.textContent = text;
      const x = document.createElement("button");
      x.textContent = "✕"; x.title = "Remove filter"; x.setAttribute("aria-label", "Remove filter: " + text);
      x.onclick = onclick;
      c.append(t, x);
      return c;
    }

    function renderBars() {
      document.querySelectorAll("#nav .navbtn").forEach(b => b.classList.toggle("active", b.dataset.key === view));
      document.querySelectorAll("#tabs .pill").forEach(b => b.classList.toggle("active", b.dataset.key === tab));
      tabsBar.style.display = view === "home" ? "flex" : "none";

      if (view !== "home") headingEl.textContent = HEADINGS[view];
      else if (q) headingEl.textContent = "Results for “" + q + "”";
      else if (sub) headingEl.textContent = sub;
      else if (topic) headingEl.textContent = topic;
      else headingEl.textContent = "Top picks in " + curSubj()[1];
      shuffleBtn.style.display = (view === "home" && !q) ? "" : "none";

      const atHome = view === "home" && !q && !topic;
      $("hero").style.display = atHome ? "" : "none";
      $("trending").style.display = (atHome && curSubj()[2]) ? "" : "none";
      if (atHome && curSubj()[2]) loadTrending();
      if (!q) $("heroInput").value = "";
      movePill();
      renderShelf();
      renderSubs();
      const live = view !== "home" || curSubj()[2];
      tabsBar.style.display = (view === "home" && live) ? "flex" : "none";
      $("topicBtn").style.display = live ? "" : "none";
      if (!live) { shuffleBtn.style.display = "none"; headingEl.textContent = curSubj()[1]; }
      filterBar.innerHTML = "";
      if (view === "home") {
        if (topic) filterBar.append(filterChip(topic + (sub ? " › " + sub : ""), () => { topic = ""; sub = ""; startFeed(); }));
        if (q) filterBar.append(filterChip("“" + q + "”", () => { q = ""; searchInput.value = ""; startFeed(); }));
      }
    }

    function startFeed() {
      seed = Math.floor(Math.random() * 1000000000);
      page = 1; done = false; loading = false; gen++;
      grid.innerHTML = "";
      statusEl.textContent = "";
      renderBars();
      window.scrollTo(0, 0);
      if (view === "home" && !curSubj()[2]) {
        done = true;
        statusEl.textContent = curSubj()[1] + " is coming soon. ";
        const go = document.createElement("button");
        go.className = "pill"; go.textContent = "Study Machine Learning meanwhile";
        go.onclick = () => pickSubject("ml");
        statusEl.appendChild(go);
        return;
      }
      loadMore();
    }

    NAV.forEach(([key, label]) => {
      if (key === "papers") {
        const a = document.createElement("a");
        a.className = "navbtn"; a.href = "/papers"; a.textContent = label;
        a.setAttribute("aria-label", "Open Research Papers");
        navBar.appendChild(a);
        return;
      }
      const b = document.createElement("button");
      b.className = "navbtn"; b.dataset.key = key; b.textContent = label;
      b.onclick = () => { view = key; startFeed(); };
      navBar.appendChild(b);
    });
    const navPill = document.createElement("span");
    navPill.id = "navPill";
    navBar.appendChild(navPill);
    function movePill() {
      const b = document.querySelector("#nav .navbtn.active");
      if (!b) { navPill.style.opacity = 0; return; }
      navPill.style.opacity = 1;
      navPill.style.width = b.offsetWidth + "px";
      navPill.style.transform = "translateX(" + b.offsetLeft + "px)";
    }
    window.addEventListener("resize", movePill);
    if (document.fonts) document.fonts.ready.then(movePill);
    TABS.forEach(([key, label]) => {
      const b = document.createElement("button");
      b.className = "pill"; b.dataset.key = key; b.textContent = label;
      b.onclick = () => { tab = key; startFeed(); };
      tabsBar.appendChild(b);
    });
    shuffleBtn.onclick = () => startFeed();

    // ----- search + recent searches -----
    const RECENT_KEY = "recent_searches";
    function getRecent() {
      try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch (e) { return []; }
    }
    function saveRecent(text) {
      if (!text) return;
      const list = getRecent().filter(s => s.toLowerCase() !== text.toLowerCase());
      list.unshift(text);
      localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 8)));
    }
    function removeRecent(text) {
      localStorage.setItem(RECENT_KEY, JSON.stringify(getRecent().filter(s => s !== text)));
    }
    function hideRecent() { suggBox.style.display = "none"; }
    function showRecent() {
      const typed = searchInput.value.trim().toLowerCase();
      const list = getRecent().filter(s => s.toLowerCase().includes(typed));
      suggBox.innerHTML = "";
      if (!list.length) { hideRecent(); return; }
      list.forEach(text => {
        const row = div("sugg-item");
        const icon = document.createElement("span"); icon.innerHTML = ICON.clock;
        const label = document.createElement("span"); label.className = "label"; label.textContent = text;
        const x = document.createElement("span"); x.className = "x"; x.textContent = "✕"; x.title = "Remove from recent searches";
        x.onclick = e => { e.stopPropagation(); removeRecent(text); showRecent(); };
        row.append(icon, label, x);
        row.onclick = () => runSearch(text);
        suggBox.appendChild(row);
      });
      suggBox.style.display = "block";
    }
    function runSearch(text) {
      q = text.trim();
      searchInput.value = q;
      view = "home";
      if (q) saveRecent(q);
      hideRecent();
      startFeed();
    }
    searchInput.addEventListener("keydown", e => {
      if (e.key === "Enter") runSearch(searchInput.value);
      if (e.key === "Escape") hideRecent();
    });
    searchInput.addEventListener("focus", showRecent);
    searchInput.addEventListener("click", showRecent);
    searchInput.addEventListener("input", showRecent);
    document.addEventListener("click", e => { if (!searchBox.contains(e.target)) hideRecent(); });

    // ----- topic drawer -----
    function item(label, count, selected, onclick) {
      const d = div("item" + (selected ? " sel" : ""));
      const a = document.createElement("span"); a.textContent = label;
      const c = document.createElement("span"); c.className = "count"; c.textContent = count;
      d.append(a, c);
      d.onclick = onclick;
      return d;
    }
    function panelHead(text, withClose) {
      const h = div("panelHead");
      const t = document.createElement("h3"); t.textContent = text;
      h.append(t);
      if (withClose) {
        const x = document.createElement("button");
        x.textContent = "✕"; x.setAttribute("aria-label", "Close topics"); x.onclick = closeDrawer;
        h.append(x);
      }
      return h;
    }
    function applyTopic(t, s) { topic = t; sub = s; view = "home"; closeDrawer(); startFeed(); }

    function renderPanels() {
      panel1.innerHTML = "";
      const head = div("atlasHead"), left = div("");
      const h = document.createElement("h3"); h.textContent = "Explore " + curSubj()[1];
      const p = document.createElement("p"); p.textContent = "Pick a topic to dive into.";
      left.append(h, p);
      const x = document.createElement("button");
      x.textContent = "✕"; x.setAttribute("aria-label", "Close topics"); x.onclick = closeDrawer;
      head.append(left, x);
      const cards = div("tcards");
      const mk = (label, count, i, selected, onclick) => {
        const c = document.createElement("button");
        c.className = "tcard" + (selected ? " sel" : "");
        let hue = 0; for (const ch of label) hue = (hue * 31 + ch.charCodeAt(0)) % 360;
        c.style.cssText = "--h:" + hue + ";--i:" + i + ";--r:" + (((i % 3) - 1) * 1.2) + "deg";
        const n = document.createElement("span"); n.className = "n"; n.textContent = count;
        const t = document.createElement("span"); t.className = "t"; t.textContent = label;
        c.append(n, t); c.onclick = onclick;
        return c;
      };
      cards.append(mk("Everything", "★", 0, !topic && !openTopic, () => applyTopic("", "")));
      let i = 1;
      tree.forEach(t => {
        if (t.count) cards.append(mk(t.name, t.count, i++, openTopic === t.name,
          () => { openTopic = t.name; renderPanels(); panel2.scrollIntoView({ block: "nearest", behavior: "smooth" }); }));
      });
      panel1.append(head, cards);

      panel2.innerHTML = "";
      const t = openTopic && tree.find(y => y.name === openTopic);
      if (!t) { panel2.style.display = "none"; return; }
      panel2.style.display = "block";
      const h4 = document.createElement("h4"); h4.textContent = "Inside " + t.name;
      const row = div("subpills");
      const pill = (label, s2, on) => {
        const b = document.createElement("button");
        b.className = "pill" + (on ? " active" : ""); b.textContent = label;
        b.onclick = () => applyTopic(t.name, s2);
        row.append(b);
      };
      pill("All " + t.name + " · " + t.count, "", topic === t.name && !sub);
      t.subs.forEach(s2 => { if (s2.count) pill(s2.name + " · " + s2.count, s2.name, topic === t.name && sub === s2.name); });
      panel2.append(h4, row);
    }
    function openDrawer() { openTopic = topic || null; renderPanels(); overlay.classList.add("open"); drawer.classList.add("open"); }
    function closeDrawer() { overlay.classList.remove("open"); drawer.classList.remove("open"); }
    $("topicBtn").onclick = openDrawer;
    overlay.onclick = closeDrawer;

    // ----- theme and keyboard shortcuts -----
    $("themeBtn").onclick = () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      localStorage.setItem("theme", next);
    };
    document.addEventListener("keydown", e => {
      const tag = document.activeElement.tagName;
      if (e.key === "/" && tag !== "INPUT" && tag !== "TEXTAREA") { e.preventDefault(); searchInput.focus(); }
      if (e.key === "Escape") { closeDrawer(); hideRecent(); closeSubjects(); }
    });

    new IntersectionObserver(entries => {
      if (entries[0].isIntersecting) loadMore();
    }, { rootMargin: "600px" }).observe(statusEl);

    function renderShelf() {
      const shelf = $("shelf");
      shelf.innerHTML = "";
      shelf.style.display = (view === "home" && curSubj()[2]) ? "flex" : "none";
      const add = (label, t, s) => {
        const b = document.createElement("button");
        b.className = "stab" + ((topic === t) ? " on" : "");
        b.textContent = label;
        b.onclick = () => applyTopic(t, s);
        shelf.append(b);
      };
      add("All", "", "");
      tree.forEach(t => { if (t.count) add(t.name, t.name, ""); });
    }
    function renderSubs() {
      const row = $("subrow");
      row.innerHTML = "";
      if (view !== "home" || !curSubj()[2] || !topic) return;
      const t = tree.find(x => x.name === topic);
      if (!t) return;
      const add = (label, s2) => {
        const b = document.createElement("button");
        b.className = "pill" + (sub === s2 ? " active" : "");
        b.textContent = label;
        b.onclick = () => applyTopic(topic, s2);
        row.append(b);
      };
      add("All " + topic, "");
      t.subs.forEach(x => { if (x.count) add(x.name, x.name); });
    }
    const GREET = {
      late: ["Hello", "night owl", "Working late? What would you like to learn?", "Late night"],
      dawn: ["Rise and shine", "early bird", "What are you looking for this morning?", "Early morning"],
      morning: ["Good morning", "", "What are you looking for today?", "Morning"],
      afternoon: ["Good afternoon", "", "What are you looking for this afternoon?", "Afternoon"],
      evening: ["Good evening", "", "What are you looking for this evening?", "Evening"],
      night: ["Hello", "night owl", "What are you looking for tonight?", "Night"],
    };
    function renderHero() {
      const now = new Date(), h = now.getHours();
      const p = h < 5 ? "late" : h < 8 ? "dawn" : h < 12 ? "morning" : h < 17 ? "afternoon" : h < 21 ? "evening" : "night";
      const g = GREET[p], name = (localStorage.getItem("name") || "").trim() || g[1];
      $("hero").dataset.p = p;
      $("eyebrow").textContent = now.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" }) + "  ·  " + g[3] + " session";
      const h1 = $("hello");
      h1.textContent = g[0];
      if (name) { h1.append(", "); const sp = document.createElement("span"); sp.textContent = name; h1.append(sp); }
      $("sub").textContent = g[2];
      $("heroInput").placeholder = "Search " + curSubj()[1] + " videos, topics, ideas…";
      $("nameBtn").textContent = localStorage.getItem("name") ? "✎ Not " + localStorage.getItem("name") + "?" : "✎ Add your name";
      const chips = $("heroChips");
      chips.innerHTML = "";
      if (curSubj()[2]) tree.filter(x => x.count).slice(0, 6).forEach(t => {
        const b = document.createElement("button");
        b.className = "hchip"; b.textContent = t.name;
        b.onclick = () => applyTopic(t.name, "");
        chips.append(b);
      });
    }

    // ----- trending: ranked by views per day since upload -----
    const trendCache = {}, trendBusy = {};
    function makeTrend(v, i) {
      const url = (v.duration <= 60 ? "https://www.youtube.com/shorts/" : "https://www.youtube.com/watch?v=") + v.video_id;
      const a = document.createElement("a");
      a.className = "tr"; a.href = url; a.target = "_blank"; a.rel = "noopener"; a.onclick = () => track(v.video_id);
      const th = div("thumb");
      const img = document.createElement("img"); img.src = v.thumbnail; img.alt = ""; img.loading = "lazy";
      const rk = div("rank"); rk.textContent = String(i + 1).padStart(2, "0");
      const bd = div("badge"); bd.textContent = fmtDuration(v.duration);
      th.append(img, rk, bd);
      const t = div("title"); t.textContent = v.title;
      const c = div("channel"); c.textContent = v.channel;
      const vel = div("vel"); vel.textContent = "↑ " + fmtViews(Math.round(v.vpd)) + " / day";
      a.append(th, t, c, vel);
      return a;
    }
    async function loadTrending() {
      const key = subj, row = $("trendRow");
      $("trendSub").textContent = "Most views per day since upload";
      if (!trendCache[key]) {
        if (trendBusy[key]) return;
        trendBusy[key] = true;
        row.innerHTML = "";
        for (let i = 0; i < 5; i++) { const s = div("card skel"); s.innerHTML = '<div class="box"></div><div class="line"></div><div class="line short"></div>'; row.appendChild(s); }
        try {
          const pages = await Promise.all([1, 2, 3].map(pg => fetch("/api/videos?" + new URLSearchParams(
            { view: "home", tab: "videos", topic: "", sub: "", q: "", page: pg, seed: 11, uid, subject: key })).then(r => r.json())));
          trendCache[key] = pages.flat().filter(v => v.duration > 60)
            .map(v => ({ ...v, vpd: v.views / Math.max(30, (Date.now() - new Date(v.published_at)) / 86400000) }))
            .sort((x, y) => y.vpd - x.vpd).slice(0, 8);
        } catch (e) { $("trending").style.display = "none"; return; }
        finally { trendBusy[key] = false; }
      }
      if (key !== subj) return;
      row.innerHTML = "";
      if (!trendCache[key].length) { $("trending").style.display = "none"; return; }
      trendCache[key].forEach((v, i) => row.appendChild(makeTrend(v, i)));
    }
    $("heroInput").addEventListener("keydown", e => { if (e.key === "Enter") runSearch($("heroInput").value); });
    $("heroGo").onclick = () => runSearch($("heroInput").value);
    $("nameBtn").onclick = () => {
      const v = prompt("What should I call you?", localStorage.getItem("name") || "");
      if (v === null) return;
      const n = v.trim().slice(0, 24);
      if (n) localStorage.setItem("name", n); else localStorage.removeItem("name");
      renderHero();
    };
    // ----- subject switcher (set ready to true when a subject has videos) -----
    const SUBJECTS = [   // [id, name, ready, accent, accent2]
      ["ml", "Machine Learning", true, "#5B5BF0", "#22B8E8"], ["cyber", "Cybersecurity", false, "#0FA37F", "#2BB4D9"],
      ["data", "Data Analytics", false, "#D97706", "#E5533C"], ["os", "Operating Systems", false, "#0E9AA7", "#3B82F6"],
      ["dsa", "Data Structures & Algorithms", false, "#7C5CF5", "#C05CE8"], ["db", "Database & Management", false, "#0284C7", "#14B8A6"],
      ["geo", "Geopolitics", false, "#E11D48", "#F97316"], ["hist", "History", false, "#A8530F", "#C98B2B"],
    ];
    let subj = localStorage.getItem("subject") || "ml";
    if (!SUBJECTS.some(x => x[0] === subj)) subj = "ml";
    const curSubj = () => SUBJECTS.find(x => x[0] === subj);
    function applyAccent() {
      document.documentElement.style.setProperty("--a", curSubj()[3]);
      document.documentElement.style.setProperty("--b", curSubj()[4]);
    }
    const subjectBtn = $("subjectBtn"), subjectMenu = $("subjectMenu");

    function renderSubjectMenu() {
      subjectMenu.innerHTML = "";
      SUBJECTS.forEach(([key, name, ready]) => {
        const b = document.createElement("button");
        b.className = "sopt" + (key === subj ? " sel" : "");
        b.setAttribute("role", "menuitem");
        const t = document.createElement("span"); t.textContent = name;
        b.append(t);
        if (!ready) { const tag = document.createElement("span"); tag.className = "soon"; tag.textContent = "Soon"; b.append(tag); }
        b.onclick = () => pickSubject(key);
        subjectMenu.appendChild(b);
      });
    }
    function closeSubjects() { subjectMenu.classList.remove("open"); subjectBtn.setAttribute("aria-expanded", "false"); }
    function pickSubject(key) {
      closeSubjects();
      if (key === subj) return;
      subj = key; localStorage.setItem("subject", key);
      topic = ""; sub = ""; q = ""; searchInput.value = ""; view = "home";
      $("subjectName").textContent = curSubj()[1];
      applyAccent();
      renderHero();
      startFeed();
    }
    subjectBtn.onclick = () => {
      if (subjectMenu.classList.contains("open")) { closeSubjects(); return; }
      renderSubjectMenu(); subjectMenu.classList.add("open"); subjectBtn.setAttribute("aria-expanded", "true");
    };
    document.addEventListener("click", e => { if (!$("subjectWrap").contains(e.target)) closeSubjects(); });
    $("subjectName").textContent = curSubj()[1];
    applyAccent();

    renderHero();
    fetch("/api/topics").then(r => r.json()).then(t => { tree = t; renderShelf(); renderHero(); });
    startFeed();
  </script>
</body>
</html>
