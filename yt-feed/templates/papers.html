<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Papers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<script>
  (function () {
    var t = localStorage.getItem("theme");
    if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root { --paper:#F4F6FB; --surface:#FFFFFF; --ink:#1B1F3B; --muted:#5F6685; --line:#D9DEEB;
          --marker:#FFE15D; --on-marker:#1B1F3B; --skel:#E6EAF4; }
  [data-theme="dark"] { --paper:#151A2E; --surface:#1F2644; --ink:#ECEFFA; --muted:#9AA3C4; --line:#2E3658;
                        --marker:#FFE15D; --on-marker:#1B1F3B; --skel:#262E50; }
  * { box-sizing: border-box; }
  body { margin:0; padding:0 24px 48px; background:var(--paper); color:var(--ink); line-height:1.45;
         font-family:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif; font-optical-sizing:auto; }
  button { font:inherit; color:inherit; cursor:pointer; }
  :focus-visible { outline:2px solid var(--ink); outline-offset:2px; }

  #top { position:sticky; top:0; z-index:10; background:var(--paper); border-bottom:1px solid var(--line);
         margin:0 -24px; padding:14px 24px 12px; }
  header { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px; }
  #back { justify-self:start; color:var(--muted); text-decoration:none; font-size:15px; font-weight:500; padding:8px 12px; border-radius:6px; }
  #back:hover { color:var(--ink); }
  h1 { margin:0; font-size:28px; font-weight:800; letter-spacing:-0.02em; }
  #tools { display:flex; justify-content:flex-end; align-items:center; gap:8px; }
  #searchBox { position:relative; flex:1; max-width:340px; }
  .searchIcon { position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px;
                stroke:var(--muted); fill:none; stroke-width:2; pointer-events:none; }
  #search { width:100%; padding:10px 14px 10px 38px; border-radius:999px; border:1.5px solid var(--line);
            background:var(--surface); color:var(--ink); font:inherit; font-size:14px; }
  #search:focus { outline:none; border-color:var(--ink); }
  #themeBtn { width:40px; height:40px; flex:none; border-radius:50%; border:1.5px solid var(--line); background:var(--surface);
              display:grid; place-items:center; }
  #themeBtn svg { width:18px; height:18px; stroke:var(--ink); fill:none; stroke-width:2; }

  .wrap { max-width:900px; margin:0 auto; }
  #controls { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; margin-top:18px; }
  .group { display:flex; gap:6px; flex-wrap:wrap; }
  .pill { background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:7px 14px; font-size:14px; white-space:nowrap; }
  .pill:hover { border-color:var(--ink); }
  .pill.active { background:var(--marker); color:var(--on-marker); border-color:var(--marker); font-weight:600; }
  #shelf { display:flex; gap:6px; overflow-x:auto; padding:14px 0 2px; scrollbar-width:none; }
  .note { color:var(--muted); font-size:13.5px; margin:14px 0 0; }
  #headRow { margin:22px 0 4px; }
  #heading { margin:0; font-size:22px; font-weight:700; letter-spacing:-0.01em; }

  .paper { padding:22px 0; border-bottom:1px solid var(--line); }
  .ptitle { font-size:19px; font-weight:700; line-height:1.3; letter-spacing:-0.01em; color:var(--ink); text-decoration:none; }
  .ptitle:hover { text-decoration:underline; text-underline-offset:3px; }
  .authors { margin-top:6px; color:var(--muted); font-size:14px; }
  .badges { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; font-size:13px; align-items:center; }
  .badge { border:1px solid var(--line); border-radius:999px; padding:2px 10px; background:var(--surface); }
  .badge.top { background:var(--marker); color:var(--on-marker); border-color:var(--marker); font-weight:600; }
  .badge.pre { border-style:dashed; color:var(--muted); }
  .cites { font-weight:600; }
  .abs { margin-top:10px; font-size:15px; line-height:1.55; display:-webkit-box; -webkit-line-clamp:3;
         -webkit-box-orient:vertical; overflow:hidden; }
  .abs.open { display:block; }
  .links { display:flex; gap:10px; margin-top:12px; align-items:center; flex-wrap:wrap; }
  .btn { border:1.5px solid var(--ink); background:none; border-radius:999px; padding:5px 14px; font-size:14px;
         text-decoration:none; color:var(--ink); }
  .btn.fill { background:var(--ink); color:var(--paper); }
  .link { background:none; border:none; padding:0; color:var(--muted); font-size:14px; text-decoration:underline; text-underline-offset:3px; }
  mark { background:var(--marker); color:var(--on-marker); border-radius:3px; padding:0 2px; }
  .skel .line { height:14px; border-radius:6px; background:var(--skel); margin-top:12px; animation:pulse 1.4s ease-in-out infinite; }
  .skel .line.w1 { width:70%; height:20px; } .skel .line.w2 { width:40%; } .skel .line.w3 { width:95%; }
  @keyframes pulse { 50% { opacity:.55; } }
  #status { text-align:center; color:var(--muted); padding:36px 12px; font-size:15px; }
  @media (max-width:760px) {
    body { padding:0 14px 40px; } #top { margin:0 -14px; padding:12px 14px; }
    header { grid-template-columns:1fr; gap:10px; } h1 { order:1; font-size:24px; } #back { order:0; padding-left:0; }
    #tools { order:2; } #searchBox { max-width:none; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
  <div id="top">
    <header>
      <a id="back" href="/">← Videos</a>
      <h1>Research Papers</h1>
      <div id="tools">
        <div id="searchBox">
          <svg class="searchIcon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="search" type="search" autocomplete="off" placeholder="Search papers  (press /)" aria-label="Search papers">
        </div>
        <button id="themeBtn" title="Switch light or dark theme" aria-label="Switch light or dark theme">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
        </button>
      </div>
    </header>
  </div>

  <div class="wrap">
    <div id="controls">
      <div class="group" id="gSort"></div>
      <div class="group" id="gKind"></div>
      <div class="group" id="gTop"></div>
    </div>
    <div id="shelf" aria-label="Topics"></div>
    <p class="note">Preprints have not been peer-reviewed. Papers open on their original sites.</p>
    <div id="headRow"><h2 id="heading"></h2></div>
    <div id="list"></div>
    <div id="status" aria-live="polite"></div>
  </div>

  <script>
    const PER_PAGE = 20;
    const SORTS = [["cited", "Most cited"], ["new", "Newest"]];
    const KINDS = [["all", "All"], ["reviewed", "Peer-reviewed"], ["preprint", "Preprints"]];
  let sort = "cited", kind = "all", topOnly = false, topic = "", q = "";
    let page = 1, loading = false, done = false, gen = 0, topics = [];

    const $ = id => document.getElementById(id);
    const list = $("list"), statusEl = $("status"), searchInput = $("search");
    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function fmtCount(n) {
      if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
      if (n >= 1e5) return Math.round(n / 1e3) + "K";
      if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
      return String(n);
    }
    function shortAuthors(s) {
      const a = (s || "").split(", ").filter(Boolean);
      if (!a.length) return "Unknown authors";
      return a.length > 4 ? a.slice(0, 4).join(", ") + " et al." : a.join(", ");
    }
    function highlight(node, text) {
      const words = q.toLowerCase().split(/\s+/).filter(w => w.length > 1);
      if (!words.length) { node.textContent = text; return; }
      const rx = new RegExp("(" + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "ig");
      text.split(rx).forEach((part, i) => {
        if (i % 2 === 1) node.appendChild(el("mark", "", part));
        else node.appendChild(document.createTextNode(part));
      });
    }

    function makePaper(p) {
      const card = el("article", "paper");
      const title = el("a", "ptitle");
      title.href = p.abs_url || p.pdf_url || "#"; title.target = "_blank"; title.rel = "noopener";
      highlight(title, p.title);
      const authors = el("div", "authors", shortAuthors(p.authors));

      const badges = el("div", "badges");
      if (p.kind === "preprint") badges.append(el("span", "badge pre", "Preprint"));
      else if (p.venue_short) badges.append(el("span", "badge" + (p.top ? " top" : ""), p.venue_short));
      if (p.published) badges.append(el("span", "", p.published.slice(0, 4)));
      if (p.citations > 0) badges.append(el("span", "cites", fmtCount(p.citations) + " citations"));

      const abs = el("div", "abs", p.summary || "No abstract available.");
      const links = el("div", "links");
      if (p.abs_url) {
        const open = el("a", "btn fill", "Open paper");
        open.href = p.abs_url; open.target = "_blank"; open.rel = "noopener";
        links.append(open);
      }
      const pdf = p.oa_pdf || p.pdf_url;
      if (pdf) {
        const a = el("a", "btn", "PDF");
        a.href = pdf; a.target = "_blank"; a.rel = "noopener";
        links.append(a);
      }
      if ((p.summary || "").length > 260) {
        const more = el("button", "link", "Show more");
        more.onclick = () => { abs.classList.toggle("open"); more.textContent = abs.classList.contains("open") ? "Show less" : "Show more"; };
        links.append(more);
      }
      card.append(title, authors, badges, abs, links);
      return card;
    }

    function showSkeleton() {
      for (let i = 0; i < 4; i++) {
        const s = el("div", "paper skel");
        s.innerHTML = '<div class="line w1"></div><div class="line w2"></div><div class="line w3"></div><div class="line w3"></div>';
        list.appendChild(s);
      }
    }

    async function loadMore() {
      if (loading || done) return;
      loading = true;
      const myGen = gen;
      if (page === 1) showSkeleton(); else statusEl.textContent = "Loading more…";
     let sort = "cited", kind = "all", topOnly = false, topic = "", q = "";
      let papers;
      try {
        const res = await fetch("/api/papers?" + params);
        papers = await res.json();
      } catch (e) {
        if (myGen === gen) {
          loading = false;
          list.querySelectorAll(".skel").forEach(s => s.remove());
          statusEl.textContent = "Couldn’t load papers. Is the server still running? ";
          const retry = el("button", "pill", "Try again");
          retry.onclick = () => { statusEl.textContent = ""; loadMore(); };
          statusEl.appendChild(retry);
        }
        return;
      }
      if (myGen !== gen) return;
      list.querySelectorAll(".skel").forEach(s => s.remove());
      papers.forEach(p => list.appendChild(makePaper(p)));
      page++;
      statusEl.textContent = "";
      if (papers.length < PER_PAGE) {
        done = true;
        statusEl.textContent = list.children.length ? "You’ve reached the end"
          : "No papers match these filters. Try removing one.";
      }
      loading = false;
      if (!done && statusEl.getBoundingClientRect().top < window.innerHeight + 600) loadMore();
    }

    function renderControls() {
      const build = (id, items, current, onpick) => {
        const g = $(id); g.innerHTML = "";
        items.forEach(([key, label]) => {
          const b = el("button", "pill" + (key === current ? " active" : ""), label);
          b.onclick = () => onpick(key);
          g.append(b);
        });
      };
      build("gSort", SORTS, sort, k => { sort = k; startFeed(); });
      build("gKind", KINDS, kind, k => { kind = k; startFeed(); });
      const g = $("gTop"); g.innerHTML = "";
     const t = el("button", "pill" + (topOnly ? " active" : ""), "Top venues only");
     t.onclick = () => { topOnly = !topOnly; startFeed(); };
      g.append(t);

      const shelf = $("shelf"); shelf.innerHTML = "";
      const add = (label, key) => {
        const b = el("button", "pill" + (topic === key ? " active" : ""), label);
        b.onclick = () => { topic = key; startFeed(); };
        shelf.append(b);
      };
      add("All topics", "");
      topics.forEach(t2 => add(t2.name, t2.name));

      $("heading").textContent = q ? "Results for “" + q + "”"
        : (sort === "cited" ? "Most cited" : "Newest") + (topic ? " in " + topic : " papers");
    }

    function startFeed() {
      page = 1; done = false; loading = false; gen++;
      list.innerHTML = ""; statusEl.textContent = "";
      renderControls();
      window.scrollTo(0, 0);
      loadMore();
    }

    searchInput.addEventListener("keydown", e => {
      if (e.key === "Enter") { q = searchInput.value.trim(); startFeed(); }
    });
    $("themeBtn").onclick = () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      localStorage.setItem("theme", next);
    };
    document.addEventListener("keydown", e => {
      const tag = document.activeElement.tagName;
      if (e.key === "/" && tag !== "INPUT" && tag !== "TEXTAREA") { e.preventDefault(); searchInput.focus(); }
    });
    new IntersectionObserver(entries => { if (entries[0].isIntersecting) loadMore(); },
                             { rootMargin: "600px" }).observe(statusEl);

    fetch("/api/paper_topics").then(r => r.json()).then(t => { topics = t; renderControls(); });
    startFeed();
  </script>
</body>
</html>
